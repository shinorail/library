<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.R.C.C. ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
    <header>
        <div class="logo">篠ノ井乗務区 <span>S.R.C.C.</span></div>
        <nav>
            <button id="fontSizeUp">A+</button>
            <button id="fontSizeDown">A-</button>
        </nav>
    </header>

    <main id="app">
        <section class="hero-section">
            <h1 class="glitch" data-text="LIBRARY_ARCHIVE">LIBRARY_ARCHIVE</h1>
            <p>鉄道の情熱を、デジタルの力で形にする。</p>
        </section>

        <div id="shelf" class="data-grid">
            <div class="loader">CONNECTING TO DATABASE...</div>
        </div>
    </main>

    <div id="reader" class="reader-overlay">
        <div class="reader-controls">
            <button onclick="closeReader()">CLOSE _</button>
            <button id="addSticky">ADD STICKY（付箋）</button>
        </div>
        <div id="sticky-container"></div>
        <div class="reader-canvas">
            <embed id="pdfViewer" src="" type="application/pdf" width="100%" height="100%" />
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
