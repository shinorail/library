<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.R.C.C. LIBRARY ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <link rel="apple-touch-icon" href="icon.png">
</head>
<body class="dark-theme">
    <div id="app">
        <header>
            <div class="header-inner">
                <div class="logo">篠ノ井乗務区 <span class="accent">S.R.C.C.</span></div>
                <nav class="a11y-tools">
                    <button id="fontUp" aria-label="文字拡大">A+</button>
                    <button id="fontDown" aria-label="文字縮小">A-</button>
                </nav>
            </div>
        </header>

        <main>
            <section class="hero">
                <h1 class="glitch">RAILWAY × TECHNOLOGY</h1>
                <p class="subtitle">鉄道の情熱を、デジタルの力で形にする。</p>
            </section>

            <section class="search-unit">
                <div class="search-bar">
                    <span class="prefix">ID_ACCESS:</span>
                    <input type="text" id="idSearchInput" placeholder="src-2605a" autocomplete="off">
                    <button id="searchBtn">EXECUTE</button>
                </div>
            </section>

            <section class="library-container">
                <h2 class="section-title">LIBRARY ARCHIVE</h2>
                <div id="shelf" class="grid-layout">
                    </div>
            </section>
        </main>

        <footer>
            <div class="footer-links">
                <button onclick="showLegal('terms')">利用規約</button>
                <button onclick="showLegal('privacy')">プライバシーポリシー</button>
            </div>
            <p class="copy">© 2026 篠ノ井乗務区 S.R.C.C.</p>
        </footer>

        <div id="reader" class="overlay hidden">
            <div class="overlay-bar">
                <span id="docTitle">SYSTEM_ACCESSING...</span>
                <div class="overlay-btns">
                    <button id="addSticky" class="btn-sm">ADD_MEMO</button>
                    <button id="closeReader" class="btn-sm close-btn">EXIT</button>
                </div>
            </div>
            <div id="stickyLayer"></div>
            <div class="viewer-container" id="viewerWrapper">
                </div>
        </div>

        <div id="legalOverlay" class="overlay hidden">
            <div class="overlay-bar">
                <span id="legalTitle">LEGAL_INFO</span>
                <button onclick="closeLegal()" class="btn-sm">BACK</button>
            </div>
            <div class="legal-content" id="legalText"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>　
</html>
